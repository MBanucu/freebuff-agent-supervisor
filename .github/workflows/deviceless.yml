name: deviceless

# The deviceless suite is the only check this repository can run without a
# Freebuff account: a fake tmux serves fixture panes, so no session, slot,
# network or gh is needed. The ruleset on main requires this job by name.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deviceless:
    name: deviceless
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the artifact rule below diffs against the base branch's
      # merge base, which a depth-1 clone does not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suite never launches Freebuff, but `start` resolves the binary
      # before it reaches the launch gate, so a stub keeps that path honest
      # on a runner without the CLI installed.
      - name: Stub freebuff on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexit 0\n' >"$RUNNER_TEMP/bin/freebuff"
          chmod +x "$RUNNER_TEMP/bin/freebuff"
          printf '%s\n' "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # The shipped file is generated from src/ (#139). A stale artifact would
      # ship code the suite never built, so the build is checked before it runs.
      - name: Check the artifact is what src/ builds
        run: ./build.sh --check

      # A stale artifact reads as "run ./build.sh", which is the wrong fix when
      # the edit was made in the artifact itself. This says which part the edit
      # belongs in (#140).
      - name: Artifact edits come with a src/ part
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          ./build.sh --edited "origin/$GITHUB_BASE_REF"

      - name: Run the deviceless suite
        run: ./spawn-freebuff-agent-test.sh
